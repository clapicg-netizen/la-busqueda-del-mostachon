<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Caza del Mostachón - Utrerapp</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <!-- Encabezado del juego -->
    <header class="game-header">
        <h1>🍩 La Caza del Mostachón</h1>
        <div id="stats" class="stats">
            <span>Puntos: <strong id="score">0</strong></span> | 
            <span>Cazados: <strong id="count">0</strong></span>
        </div>
    </header>

    <!-- Mapa de Utrera -->
    <div id="map"></div>

    <!-- Modal de Caza (Aparece al estar cerca de un mostachón) -->
    <div id="catch-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="mostachon-title">¡Mostachón Encontrado!</h2>
            <p id="mostachon-desc">¡Estás muy cerca! Toca el botón para cazarlo.</p>
            <button id="catch-btn" class="btn-catch">🍩 ¡CAZAR AHORA!</button>
        </div>
    </div>

    <!-- Librerías de Mapa y Lógica -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
