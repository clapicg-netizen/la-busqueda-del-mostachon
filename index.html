<!DOCTYPE html>
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Caza del Mostachón - Utrerapp</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <!-- Encabezado del juego -->
    <header class="game-header">
        <div class="user-info">
            <span>👤 <strong id="player-nickname">Cazador</strong></span>
            <button id="btn-ranking-open" class="btn-ranking-top">🏆 Ranking</button>
        </div>
        <h1>🍩 La Caza del Mostachón</h1>
        <div id="stats" class="stats">
            <span>Puntos: <strong id="score">0</strong></span> | 
            <span>Cazados: <strong id="count">0</strong></span>
        </div>
    </header>

    <!-- Mapa de Utrera -->
    <div id="map"></div>

    <!-- Modal 1: Registro de Apodo (Primera vez) -->
    <div id="nickname-modal" class="modal">
        <div class="modal-content">
            <h2>🍩 ¡Bienvenido a La Caza del Mostachón!</h2>
            <p>Elige tu apodo para competir en el Ranking de Utrera:</p>
            <input type="text" id="nickname-input" placeholder="Tu Apodo / Nick" maxlength="15" />
            <button id="save-nickname-btn" class="btn-action">¡EMPEZAR A CAZAR!</button>
        </div>
    </div>

    <!-- Modal 2: Caza de Mostachón -->
    <div id="catch-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="mostachon-title">¡Mostachón Encontrado!</h2>
            <p id="mostachon-desc">¡Estás muy cerca! Toca el botón para cazarlo.</p>
            <button id="catch-btn" class="btn-action">🍩 ¡CAZAR AHORA!</button>
        </div>
    </div>

    <!-- Modal 3: Tabla de Ranking -->
    <div id="ranking-modal" class="modal hidden">
        <div class="modal-content ranking-box">
            <h2>🏆 Top Cazadores de Utrera</h2>
            <div id="ranking-list" class="ranking-list">
                <!-- Se puebla dinámicamente -->
            </div>
            <button id="close-ranking-btn" class="btn-close">Cerrar</button>
        </div>
    </div>

    <!-- Librerías de Mapa y Lógica -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
